<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boundary community</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202827;font:16px/1.5 system-ui,sans-serif}header{background:#147653;color:white;padding:16px 24px;display:flex;align-items:center;gap:24px}header a{color:white}main{max-width:900px;margin:auto;padding:24px}h1{font-size:28px}section,article{background:white;border:1px solid #e1e5e1;border-radius:8px;padding:20px;margin:16px 0}label{display:block;margin-top:12px}input,select,textarea{width:100%;padding:12px;font:inherit;border:1px solid #84958b;border-radius:5px}textarea{min-height:110px}button{padding:12px 18px;margin:8px 8px 8px 0;background:#147653;color:white;border:0;border-radius:5px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.meta{font-size:13px;color:#52645a}.details{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a22222}#account{margin-left:auto}#sign-in:empty{display:none}[hidden]{display:none!important}.reply{border-top:1px solid #ddd;padding-top:12px}</style></head>
<body><header><strong>Boundary</strong><a href="/">Live scores</a><div id="account"></div></header><main>
<h1>Cricket community</h1><p>Find players, opponents, officials, grounds and coaches. Share cricket updates.</p>
<p id="status" role="status">Connecting…</p><div id="sign-in"></div>
<section id="composer" hidden><h2>Create a post</h2><form id="post-form">
<label>Category<select name="category"><option value="players">Looking for players</option><option value="opponents">Looking for opponents</option><option value="umpires">Umpires</option><option value="scorers">Scorers</option><option value="grounds">Grounds</option><option value="coaches">Coaches</option><option value="updates">Cricket update</option></select></label>
<label>Title<input name="title" maxlength="160" required></label><label>City<input name="city" maxlength="100" required></label><label>Details<textarea name="body" maxlength="3000" required></textarea></label>
<p class="meta">Posts and replies are public. Include only details you want everyone to see.</p><button type="submit">Publish post</button></form></section>
<label>Search current posts<input id="search" type="search" placeholder="Search city, team or role"></label><button id="refresh">Refresh posts</button><div id="posts"></div>
</main><script type="module" src="/community.js"></script></body></html>
