<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142a24"><title>Boundary · Cricket live</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6ef;color:#142a24;font:16px/1.5 system-ui,sans-serif}header{padding:24px max(24px,calc((100% - 960px)/2));font-weight:800;letter-spacing:.12em;color:#147653;border-bottom:1px solid #dce6d6}main{max-width:960px;padding:40px 24px;margin:auto}h1{font-size:clamp(36px,7vw,62px);line-height:1.08;letter-spacing:-.04em;margin:12px 0 20px}p{color:#748177}.eyebrow{font-size:12px;font-weight:800;color:#147653;text-transform:uppercase;letter-spacing:.12em}.card{background:white;padding:24px;border-radius:20px;margin-bottom:16px}.score{background:#142a24;color:white;padding:30px;border-radius:24px}.score .eyebrow{color:#d0ed8c}.total{font-size:70px;font-weight:800;line-height:1.2}.score p{color:#d0dfd3}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.match{cursor:pointer;border:1px solid transparent}.match:hover,.match:focus{border-color:#147653}.feed{list-style:none;padding:0}.feed li{padding:12px 0;border-top:1px solid #e6eddf}.bar{height:12px;background:#e6eddf;border-radius:8px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#147653}button{border:0;border-radius:8px;padding:12px 18px;color:white;background:#147653;cursor:pointer}footer{max-width:960px;margin:auto;padding:24px;color:#748177;font-size:12px}.error{color:#9d422d}a{color:#147653}.subtle{font-size:13px;color:#748177}
</style></head><body><header>BOUNDARY / CLUB CRICKET</header><main><div class="eyebrow">Every ball. Every ground.</div><h1 id="title">Cricket is happening.</h1><p id="status" role="status">Connecting to the live score service…</p><div id="view"></div></main><footer>Scores are published by match officials. Win percentages are statistical estimates. Updates refresh every 3 seconds.</footer><script type="module">
const view=document.querySelector('#view'), status=document.querySelector('#status');let selected=new URLSearchParams(location.search).get('match');let fetching=false;
const el=(tag,text,cls)=>{let node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
function matchCard(m){let node=el('article',undefined,'card match');node.tabIndex=0;node.append(el('div',m.result==='Live'?'LIVE MATCH':m.result,'eyebrow'),el('h2',m.name),el('div',`${m.runs}/${m.wickets} · ${m.overs} overs`),el('p',m.venue||'Local ground'));const open=()=>{selected=m.id;history.pushState({},'',`?match=${encodeURIComponent(m.id)}`);refresh();};node.onclick=open;node.onkeydown=e=>{if(e.key==='Enter')open();};return node;}
function detail(m){let back=el('button','All matches');back.onclick=()=>{selected=null;history.pushState({},'','/');refresh();};view.append(back,el('p',m.venue||'Local ground'));document.querySelector('#title').textContent=m.name;let score=el('section',undefined,'score');score.append(el('div',m.battingTeam,'eyebrow'),el('div',`${m.runs} / ${m.wickets}`,'total'),el('p',`${m.overs} overs · ${m.target?`Target ${m.target} · Need ${Math.max(0,m.target-m.runs)} off ${m.remaining}`:'First innings'}`));view.append(score);if(m.probability!==null){let c=el('section',undefined,'card');c.style.marginTop='16px';c.append(el('h3',`Win estimate · ${m.probability}%`));let bar=el('div',undefined,'bar'),fill=el('span');fill.style.width=`${Math.max(0,Math.min(100,m.probability))}%`;bar.append(fill);c.append(bar);view.append(c);}let feed=el('section',undefined,'card');feed.append(el('h2','Ball-by-ball'));let list=el('ul',undefined,'feed');for(let line of [...m.commentary].reverse())list.append(el('li',line));feed.append(list);view.append(feed);}
async function refresh(){if(fetching)return;fetching=true;try{let response=await fetch('/api/matches'+(selected?'?id='+encodeURIComponent(selected):''),{cache:'no-store'});if(!response.ok)throw new Error('Score service is temporarily unavailable. Please retry.');let data=await response.json();view.replaceChildren();if(selected){if(!data){status.textContent='This match has not been published yet. The scorer may be offline.';return;}detail(data);}else{document.querySelector('#title').textContent='Cricket is happening.';let list=el('section',undefined,'list');for(let m of data)list.append(matchCard(m));view.append(list);if(data.length===0)view.append(el('article','No matches published yet. The first scorecard will appear here when an official starts scoring.','card'));}status.className='subtle';status.textContent='Updated '+new Date().toLocaleTimeString()+' · Official score service';}catch(e){status.className='error';status.textContent=e.message;}finally{fetching=false;}}
window.onpopstate=()=>{selected=new URLSearchParams(location.search).get('match');refresh();};refresh();setInterval(()=>{if(!document.hidden)refresh();},3000);
</script></body></html>
