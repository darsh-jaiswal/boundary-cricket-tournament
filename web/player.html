<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Boundary — Your player profile</title><link rel="stylesheet" href="/shop.css"><style>main{max-width:480px;padding:32px 20px}h1{font-size:32px;line-height:1.15}header{position:static}form{display:grid;gap:20px}input{width:100%}.accept input{width:auto}#open-app{display:block;text-align:center}#open-app[hidden]{display:none}</style></head>
<body><header><a class="brand" href="/">BOUNDARY<span>YOUR CRICKET IDENTITY</span></a><div id="account"></div></header>
<main><h1 id="heading">Your player profile</h1><p id="status" role="status" aria-live="polite">Loading your account…</p>
<form id="register" hidden><label>Display name<input name="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>Unique username<input name="username" required minlength="3" maxlength="24" pattern="[a-zA-Z][a-zA-Z0-9_]{2,23}" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="darsh_11"><small>3–24 letters, numbers or underscores. Start with a letter. Each username belongs to one player.</small></label><label class="accept" id="terms-row"><input id="accept-terms" type="checkbox" required> I agree to the <a href="/terms.html">Terms &amp; Conditions</a> and acknowledge the <a href="/privacy.html">Privacy Policy</a>.</label><button id="save">Continue</button></form>
<a id="open-app" class="button" hidden>Open Boundary</a><button id="retry" hidden>Try again</button><button id="legacy" hidden>Return to the Android app</button><p id="profile-links" hidden><a href="/shop.html">Shop</a> · <a href="/community.html">Community</a></p>
</main><script type="module" src="/player.js"></script></body></html>
